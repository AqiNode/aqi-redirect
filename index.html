<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
  <meta name="google-site-verification" content="ZlLAxcWwl3OVcBo-fPQVxUHzlHUevW4-Vwa1gB3Fb8U" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505" />
  <title>Aqinode — HQ Redirect</title>
  <meta name="description" content="Aqinode HQ — shaping what's next. Connecting you to aqinode.com.ng." />
  <link rel="canonical" href="https://aqinode.com.ng" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Aqinode" />
  <meta property="og:title" content="Aqinode — HQ Redirect" />
  <meta property="og:description" content="Aqinode HQ — shaping what's next. Connecting you to aqinode.com.ng." />
  <meta property="og:url" content="https://aqinode.com.ng" />
  <meta property="og:image" content="https://aqinode.com.ng/img/logo.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Aqinode — HQ Redirect" />
  <meta name="twitter:description" content="Aqinode HQ — shaping what's next. Connecting you to aqinode.com.ng." />
  <meta name="twitter:image" content="https://aqinode.com.ng/img/logo.png" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Aqinode — HQ Redirect",
      "description": "Aqinode HQ — shaping what's next. Connecting you to aqinode.com.ng.",
      "url": "https://aqinode.com.ng",
      "publisher": {
        "@type": "Organization",
        "name": "Aqinode",
        "url": "https://aqinode.com.ng",
        "logo": {
          "@type": "ImageObject",
          "url": "https://aqinode.com.ng/img/logo.png"
        }
      }
    }
  </script>
  <link rel="shortcut icon" href="https://aqinode.com.ng/favicon.ico" />
  <link rel="icon" href="https://aqinode.com.ng/icon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="https://aqinode.com.ng/icon-16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="https://aqinode.com.ng/apple-touch-icon.png" sizes="180x180" type="image/png" />
  <noscript>
    <meta http-equiv="refresh" content="3;url=https://aqinode.com.ng" />
  </noscript>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("aqinode-theme");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <style>
    @font-face {
      font-family: "GeistSans";
      src: url("https://aqinode.com.ng/_next/static/media/dbccb4a9e22cbf0d-s.p.woff2") format("woff2");
      font-display: swap;
      font-weight: 100 900;
    }

    @font-face {
      font-family: "GeistSans Fallback";
      src: local("Arial");
      ascent-override: 94.56%;
      descent-override: 27.76%;
      line-gap-override: 0%;
      size-adjust: 106.28%;
    }

    @font-face {
      font-family: "GeistMono";
      src: url("https://aqinode.com.ng/_next/static/media/acc1c922d613a50a.p.woff2") format("woff2");
      font-display: swap;
      font-weight: 100 900;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-primary: #050505;
      --bg-secondary: #0c0c0f;
      --bg-card: #111114;
      --bg-card-hover: #18181c;
      --accent: #d4d4d8;
      --accent-strong: #ffffff;
      --accent-muted: hsla(240, 5%, 84%, 0.14);
      --accent-ghost: hsla(240, 5%, 84%, 0.08);
      --accent-border: hsla(240, 5%, 84%, 0.28);
      --on-accent: #09090b;
      --text-primary: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --text-faint: #3f3f46;
      --border: hsla(0, 0%, 100%, 0.08);
      --border-strong: hsla(0, 0%, 100%, 0.14);
      --glass-bg-strong: rgba(17, 17, 20, 0.55);
      --glass-border: hsla(0, 0%, 100%, 0.12);
      --glass-highlight: hsla(0, 0%, 100%, 0.18);
      --font-display: "GeistSans", "GeistSans Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-body: "GeistSans", "GeistSans Fallback", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "GeistMono", ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Monaco, "Liberation Mono", "DejaVu Sans Mono", "Courier New", monospace;
      --text-xs: 0.72rem;
      --text-sm: 0.875rem;
      --text-base: 1.0625rem;
      --text-xl: 1.75rem;
      --leading-tight: 1.04;
      --leading-body: 1.65;
      --tracking-display: -0.04em;
      --tracking-mono: 0.1em;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 999px;
      --t-fast: 150ms cubic-bezier(0.23, 1, 0.32, 1);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.22);
    }

    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --bg-primary: #ffffff;
        --bg-secondary: #f4f4f5;
        --bg-card: #ffffff;
        --bg-card-hover: #fafafa;
        --accent: #3f3f46;
        --accent-strong: #09090b;
        --accent-muted: rgba(63, 63, 70, 0.1);
        --accent-ghost: rgba(63, 63, 70, 0.06);
        --accent-border: rgba(63, 63, 70, 0.22);
        --on-accent: #ffffff;
        --text-primary: #09090b;
        --text-secondary: #52525b;
        --text-muted: #71717a;
        --text-faint: #a1a1aa;
        --border: rgba(9, 9, 11, 0.08);
        --border-strong: rgba(9, 9, 11, 0.14);
        --glass-bg-strong: hsla(0, 0%, 100%, 0.72);
        --glass-border: rgba(9, 9, 11, 0.1);
        --glass-highlight: hsla(0, 0%, 100%, 0.9);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f4f4f5;
      --bg-card: #ffffff;
      --bg-card-hover: #fafafa;
      --accent: #3f3f46;
      --accent-strong: #09090b;
      --accent-muted: rgba(63, 63, 70, 0.1);
      --accent-ghost: rgba(63, 63, 70, 0.06);
      --accent-border: rgba(63, 63, 70, 0.22);
      --on-accent: #ffffff;
      --text-primary: #09090b;
      --text-secondary: #52525b;
      --text-muted: #71717a;
      --text-faint: #a1a1aa;
      --border: rgba(9, 9, 11, 0.08);
      --border-strong: rgba(9, 9, 11, 0.14);
      --glass-bg-strong: hsla(0, 0%, 100%, 0.72);
      --glass-border: rgba(9, 9, 11, 0.1);
      --glass-highlight: hsla(0, 0%, 100%, 0.9);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    html {
      font-size: 16px;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: var(--leading-body);
      font-size: var(--text-base);
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      background: var(--accent);
      color: var(--on-accent);
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .redirect-card {
      width: 100%;
      max-width: 520px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 5vw, 40px);
      box-shadow: var(--shadow-md);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      padding-bottom: var(--space-6);
      margin-bottom: var(--space-6);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: var(--tracking-display);
      text-decoration: none;
    }

    .brand img {
      width: 30px;
      height: 30px;
      object-fit: contain;
      display: block;
    }

    .brand em {
      font-style: normal;
      color: var(--text-primary);
    }

    .mono-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: var(--tracking-mono);
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--tracking-mono);
      color: var(--text-muted);
      margin-bottom: var(--space-4);
    }

    .section-label::before {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: var(--text-primary);
      margin-bottom: var(--space-3);
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: var(--leading-body);
      margin-bottom: var(--space-6);
    }

    .progress-track {
      width: 100%;
      height: 3px;
      border-radius: var(--radius-pill);
      background: var(--border);
      overflow: hidden;
      margin-bottom: var(--space-6);
    }

    .progress-fill {
      width: 100%;
      height: 100%;
      border-radius: var(--radius-pill);
      background: var(--accent);
      transform-origin: left center;
      transform: scaleX(0);
      animation: progressFill 2.5s linear forwards;
    }

    @keyframes progressFill {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    .fallback {
      font-size: var(--text-sm);
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .fallback-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
      color: var(--text-primary);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
      padding-bottom: 2px;
      transition: border-color var(--t-fast), color var(--t-fast);
    }

    .fallback-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .fallback-link span {
      transition: transform 0.2s var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .fallback-link:hover span {
        transform: translateX(3px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .progress-fill {
        animation: none !important;
        transform: scaleX(1);
      }
    }
  </style>
</head>
<body>
  <main class="redirect-card">
    <div class="card-top">
      <div class="brand">
        <img src="https://aqinode.com.ng/img/logo.png" alt="Aqinode logo" width="30" height="30" />
        <span><em>Aqi</em>node</span>
      </div>
      <span class="mono-tag">HQ Redirect</span>
    </div>

    <p class="section-label">Routing</p>
    <h1>Please wait while we redirect you to our HQ</h1>
    <p class="subtitle">Connecting you to aqinode.com.ng — shaping what&rsquo;s next.</p>

    <div class="progress-track" role="progressbar" aria-label="Redirect progress" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill"></div>
    </div>

    <p class="fallback">
      <a id="fallback-link" class="fallback-link" href="https://aqinode.com.ng">
        Not redirected? Go to AqiNode HQ <span aria-hidden="true">→</span>
      </a>
    </p>
  </main>

  <script>
    const TARGET_URL = "https://aqinode.com.ng";

    const fallbackLink = document.getElementById("fallback-link");
    if (fallbackLink) {
      fallbackLink.href = TARGET_URL;
    }

    window.setTimeout(function () {
      window.location.replace(TARGET_URL);
    }, 2500);
  </script>
</body>
</html>
